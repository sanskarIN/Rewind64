name: Publish experimental Linux prerelease
# Publishes the tested experimental v0.1.6 tag from main once this workflow is merged.
# The job does not overwrite a pre-existing release.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prerelease.yml'

permissions:
  contents: write

concurrency:
  group: rewind64-v0.1.6-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install NASM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm
      - name: Verify canonical Assembly build and integration tests
        run: make clean && make test
      - name: Package native binary with source license and documentation
        run: |
          mkdir -p dist/package/rewind64-v0.1.6-linux-x86_64
          install -m 0755 build/rewind64 dist/package/rewind64-v0.1.6-linux-x86_64/rewind64
          cp README.md LICENSE dist/package/rewind64-v0.1.6-linux-x86_64/
          tar -czf dist/rewind64-v0.1.6-linux-x86_64.tar.gz -C dist/package rewind64-v0.1.6-linux-x86_64
          (cd dist && sha256sum rewind64-v0.1.6-linux-x86_64.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish v0.1.6 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.6 >/dev/null 2>&1; then
            echo "v0.1.6 already published; will not overwrite it."
            exit 0
          fi
          gh release create v0.1.6 \
            dist/rewind64-v0.1.6-linux-x86_64.tar.gz \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Rewind64 v0.1.6 (Linux x86-64 experimental)" \
            --notes-file docs/releases/v0.1.6.md \
            --prerelease
